name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (no live API calls)
        # CI 上没有 DEEPSEEK_API_KEY，也刻意不放：
        # 省钱 + 结果确定（CLAUDE.md §7）。live 标记的测试整体排除。
        run: pytest -m "not live"

      - name: Metric regression gate
        # 三道闸，都离线（CLAUDE.md §7；闸 C 见 PERF_SPEC 任务 B）：
        #   闸 C 稳定性闸——stability/summary.json 的成功率跨次标准差与轨迹自洽率过阈值，
        #        且除答案相似度外的每个数字都能由 stability/raw/ 重算出来、逐位相等。
        #   闸 A 口径闸——tests/fixtures 里的冻结子集重算指标，与 reports/gate_baseline.json
        #        逐位比对。输入没变数字却变了，只可能是指标口径被改动，涨跌都拦。
        #   闸 B 回归闸——reports/latest.json 与上一份快照比，关键指标
        #        （task_success_rate / tool_accuracy / faithfulness）跌超
        #        config.METRIC_DROP_TOLERANCE 即 fail。
        # 与信贷风控项目里 PSI 触发告警是同一思路，搬到 Agent 评测上。
        run: python -m src.eval.report --gate
